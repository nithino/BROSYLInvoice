name: macOS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core acceptance checks
        run: ./validate.sh
      - name: XCTest
        run: swift test
      - name: PDF content and pagination
        run: ./validate-pdf.sh
      - name: Package native app
        run: ./build-app.sh
      - name: Archive application
        run: ditto -c -k --sequesterRsrc --keepParent 'dist/Brosyl Workshop Pricing Calculator.app' dist/BrosylWorkshop-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BrosylWorkshop-macOS
          path: dist/BrosylWorkshop-macOS.zip
